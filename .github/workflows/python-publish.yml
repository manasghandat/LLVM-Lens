# Publishes llvm-lens to PyPI when a GitHub release is published.
# Trusted publishing (OIDC), so no API token lives in the repo: the PyPI
# project must list this repo's `pypi` environment as a trusted publisher.

name: Publish Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine
          python -m pip install ".[dev]"

      # The version comes from llvm_lens.__version__, not from the tag, so a
      # mismatched tag would publish under the wrong number.
      - name: Check the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python -c 'import llvm_lens; print(llvm_lens.__version__)')"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::release tag $TAG does not match llvm_lens.__version__ ($version)"
            exit 1
          fi
          echo "release tag $TAG matches version $version"

      # Integration tests skip themselves when LLVM 22 or node is absent, which
      # is the case on a default runner.
      - name: Run the test suite
        run: python -m pytest -q

      - name: Build the distributions
        run: python -m build

      # Not --strict: a newer setuptools warns about the deprecated
      # `license = { text = ... }` table, which strict mode would fail on.
      - name: Check the distributions
        run: python -m twine check dist/*

      # The report frontend ships as package data, so a missing entry in
      # [tool.setuptools.package-data] is invisible until a wheel is installed.
      - name: Smoke test the built wheel
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/smoke/bin/llvm-lens" --version
          "$RUNNER_TEMP/smoke/bin/python" - <<'PY'
          import sys

          from llvm_lens import __version__
          from llvm_lens.emit import FRONTEND_FILES
          from llvm_lens.report import default_frontend_dir

          frontend = default_frontend_dir()
          missing = [name for name in FRONTEND_FILES if not (frontend / name).is_file()]
          if missing:
              sys.exit("wheel is missing frontend assets: " + ", ".join(missing))
          print(f"llvm-lens {__version__}: all {len(FRONTEND_FILES)} frontend assets present")
          PY

      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write  # required for trusted publishing

    # The environment name must match the trusted publisher configured on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/p/llvm-lens

    steps:
      - name: Retrieve the distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
