<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLVM-Lens</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span>LLVM-Lens</div>
  <div class="meta" id="meta"></div>
  <div class="controls">
    <label class="check"><input type="checkbox" id="changedOnly"> changed only</label>
    <input type="search" id="fnFilter" placeholder="filter function…" title="Filter functions across all views">
  </div>
</header>
<main id="app"></main>
<!-- CFG graph stack: load order matters (dagre before cytoscape-dagre;
     cytoscape before the extension that registers on it). -->
<script src="vendor/cytoscape.min.js"></script>
<script src="vendor/dagre.min.js"></script>
<script src="vendor/cytoscape-dagre.js"></script>
<script src="app.js"></script>
</body>
</html>
